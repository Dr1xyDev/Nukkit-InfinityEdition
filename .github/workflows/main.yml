# Unpack Nukkit-InfinityEdition.zip into the repository and push the files
name: Unzip Nukkit-InfinityEdition.zip and commit contents

# Run manually from the Actions tab
on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to the zip file inside the repo (relative to repo root)'
        required: true
        default: 'Nukkit-InfinityEdition.zip'

permissions:
  contents: write

jobs:
  unzip-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install unzip
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Verify zip exists
        run: |
          ZIP_PATH="${{ github.workspace }}/${{ github.event.inputs.zip_path }}"
          if [ ! -f "$ZIP_PATH" ]; then
            echo "Zip file not found: $ZIP_PATH"
            exit 1
          fi
          echo "Found zip: $ZIP_PATH"

      - name: Extract zip to repository root
        run: |
          set -euo pipefail
          ZIP_PATH="${{ github.workspace }}/${{ github.event.inputs.zip_path }}"
          TMPDIR=$(mktemp -d)
          echo "Extracting $ZIP_PATH -> $TMPDIR"
          unzip -o "$ZIP_PATH" -d "$TMPDIR"
          # Move extracted contents into the workspace root, including dotfiles
          bash -lc 'shopt -s dotglob; mv "$TMPDIR"/* "${GITHUB_WORKSPACE}/" || true'
          rm -rf "$TMPDIR"

      - name: Show git changes
        run: |
          git status --porcelain
          ls -la

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Unpack ${{ github.event.inputs.zip_path }} into repository"
          git push
